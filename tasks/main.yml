---
# Variable setup.
- name: Include OS-specific variables.
  include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Define redis_package.
  set_fact:
    redis_package: "{{ __redis_package }}"
  when: redis_package is not defined

# Debian-based packages start Redis on install, so the config must be in place
# beforehand (e.g. so Redis can start on hosts with IPv6 disabled).
- name: Configure Redis (before install).
  include_tasks: configure.yml
  when: ansible_facts.os_family == 'Debian'

# Setup/install tasks.
- include_tasks: setup-RedHat.yml
  when: ansible_facts.os_family == 'RedHat'

- include_tasks: setup-Debian.yml
  when: ansible_facts.os_family == 'Debian'

- include_tasks: setup-Archlinux.yml
  when: ansible_facts.os_family == 'Archlinux'

# Other package managers (e.g. RPM) may replace or back up a pre-existing
# config file during install, which breaks idempotence, so configure after.
- name: Configure Redis (after install).
  include_tasks: configure.yml
  when: ansible_facts.os_family != 'Debian'

- name: Ensure Redis is running.
  service:
    name: "{{ redis_daemon }}"
    state: started
    enabled: "{{ redis_enabled }}"
